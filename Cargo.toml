[workspace]
resolver = "2"
members = ["neka-core", "neka-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

# O Argon2id sem otimização deixa os testes lentos demais.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.ciborium]
opt-level = 3

[profile.dev.package.rust-argon2]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.keepass]
opt-level = 3
