  <text x="64" y="282" font-family="'Segoe UI','Nunito','Hiragino Maru Gothic ProN','Yu Gothic UI',system-ui,sans-serif" font-size="21" font-weight="600" fill="#ffe9f4">passwords in your terminal, cozy and well kept</text>
  <text x="64" y="312" font-family="'Segoe UI','Nunito','Hiragino Maru Gothic ProN','Yu Gothic UI',system-ui,sans-serif" font-size="16" fill="#ff9ac8">one encrypted vault · syncs through your Drive</text>
