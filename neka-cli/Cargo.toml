[package]
name = "neka-cli"
description = "A cozy password manager for your terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "neka"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive"] }
neka-core = { path = "../neka-core" }
ratatui = "0.30.2"
rpassword = "7.5.5"
zeroize = "1.9.1"

[lints]
workspace = true
